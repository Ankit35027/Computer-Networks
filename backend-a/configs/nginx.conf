# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf  –  Mac 3 | Extension E: Standby Edge Gateway
#
# This is a STANDBY edge proxy.  Normally traffic reaches Mac 2's nginx.
# When DNS is updated so that app.team1.test → 10.7.8.30 (this host),
# clients cut over within 30 seconds (TTL expiry) and this nginx takes over.
#
# Mirrors Mac 2 nginx config exactly so the failover is transparent.
#
# Usage (assuming brew-installed nginx):
#   Test config →  sudo nginx -t -c /path/to/configs/nginx.conf
#   Start       →  sudo nginx -c /path/to/configs/nginx.conf
#   Reload      →  sudo nginx -s reload
#   Stop        →  sudo nginx -s stop
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /tmp/nginx-standby-error.log warn;
pid       /tmp/nginx-standby.pid;

events {
    worker_connections 1024;
}

http {
    include       /usr/local/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream=$upstream_addr '
                      'cache=$upstream_cache_status';

    access_log  /tmp/nginx-standby-access.log  main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Upstream: Backend A (local, port 3001) ─────────────────────────────
    upstream backend_a {
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ── Proxy Cache ────────────────────────────────────────────────────────
    proxy_cache_path /tmp/nginx_cache_standby
        levels=1:2
        keys_zone=standby_cache:10m
        max_size=100m
        inactive=10m
        use_temp_path=off;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen      8080;
        server_name app.team1.test;

        return 301 https://$host:8443$request_uri;
    }

    # ── HTTPS Standby Edge ─────────────────────────────────────────────────
    server {
        listen      8443 ssl;
        server_name app.team1.test;

        # TLS certificates (generated via make-certs.sh in certs/)
        ssl_certificate     /Users/kushagrabhardwaj/Desktop/backend-a/certs/app.team1.test.crt;
        ssl_certificate_key /Users/kushagrabhardwaj/Desktop/backend-a/certs/app.team1.test.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── HSTS ──────────────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000" always;

        # ── Proxy to Backend A ────────────────────────────────────────────
        location / {
            proxy_pass         http://backend_a;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # ── Caching (mirrors Mac 2 edge behaviour) ─────────────────
            # Cache GET / for 60 s (respects Cache-Control: max-age=60 from backend)
            proxy_cache            standby_cache;
            proxy_cache_valid      200 60s;
            proxy_cache_valid      301 302 10s;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
            proxy_cache_lock       on;
            add_header             X-Cache-Status $upstream_cache_status;

            # Pass-through ETag / conditional request support
            proxy_pass_header      ETag;
            proxy_ignore_headers   Cache-Control;   # rely on proxy_cache_valid above

            # Timeout / retry
            proxy_connect_timeout  5s;
            proxy_send_timeout     10s;
            proxy_read_timeout     10s;
            proxy_next_upstream    error timeout http_502 http_503;
        }

        # ── /api/* – never cache (dynamic, no-store) ──────────────────────
        location /api/ {
            proxy_pass         http://backend_a;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_cache        off;

            proxy_connect_timeout  5s;
            proxy_send_timeout     10s;
            proxy_read_timeout     10s;
        }

        # ── /health – lightweight probe ───────────────────────────────────
        location /health {
            proxy_pass         http://backend_a/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_cache        off;
        }
    }
}
