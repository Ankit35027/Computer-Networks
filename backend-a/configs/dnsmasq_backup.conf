# ─────────────────────────────────────────────────────────────────────────────
# dnsmasq_backup.conf  –  Mac 3 | Extension A: Backup DNS Resolver
# Role   : Secondary DNS for the team1.test private domain
# Listens: 0.0.0.0:53  (all interfaces on Mac 3)
# Primary: 10.7.8.10  (Mac 1)   Secondary: this host (10.7.8.30)
# ─────────────────────────────────────────────────────────────────────────────

# ── Daemon / process ─────────────────────────────────────────────────────────
# (when run with -d flag these are overridden; useful for systemd / launchd)
# no-daemon
# pid-file=/var/run/dnsmasq-backup.pid

# ── Listen address ───────────────────────────────────────────────────────────
# Bind only to the LAN interface so we don't conflict with the primary DNS
interface=en0
# Also accept loopback for local verification
listen-address=127.0.0.1,10.7.8.30

# Use a non-standard port when testing locally to avoid needing root
# Comment out the line below (and the listen-address) when running as root on :53
# port=5353

# ── Upstream forwarders (recursive resolution) ───────────────────────────────
# Use Mac 1 primary DNS first, then fall back to public resolvers
server=10.7.8.10
server=1.1.1.1
server=8.8.8.8

# ── Private domain: team1.test ───────────────────────────────────────────────
# Only resolve .test queries locally; everything else is forwarded upstream
local=/team1.test/

# A records for the lab topology
# Mac 1 – Primary DNS + Primary Edge
address=/ns1.team1.test/10.7.8.10
address=/mac1.team1.test/10.7.8.10

# Mac 2 – Primary Edge Proxy
address=/edge.team1.test/10.7.8.201
address=/mac2.team1.test/10.7.8.201
# app.team1.test normally points to Mac 2 edge; flip this to Mac 3 for failover
address=/app.team1.test/10.7.8.201

# Mac 3 – This host (Backup DNS + Backend A + Standby Edge)
address=/ns2.team1.test/10.7.8.30
address=/mac3.team1.test/10.7.8.30
address=/backend-a.team1.test/10.7.8.30

# Mac 4 – Client
address=/mac4.team1.test/10.7.8.40

# ── Caching ──────────────────────────────────────────────────────────────────
cache-size=500
# Honour the TTL from upstream; set a floor of 30 s (same as the edge TTL)
min-cache-ttl=30

# ── Security ─────────────────────────────────────────────────────────────────
# Do not read /etc/hosts on this host (keep resolver deterministic)
no-hosts
# Ignore /etc/resolv.conf and rely solely on server= lines above
no-resolv

# ── Logging ──────────────────────────────────────────────────────────────────
log-queries
log-facility=/tmp/dnsmasq-backup.log
