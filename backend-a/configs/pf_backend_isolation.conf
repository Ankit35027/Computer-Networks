# ─────────────────────────────────────────────────────────────────────────────
# pf_backend_isolation.conf  –  Mac 3 | Extension C: Service Isolation Firewall
# Purpose : Block direct external traffic to port 3001 (Backend A).
#           Only Mac 2 Edge Proxy (10.7.8.201) may reach port 3001.
#
# Usage   :
#   Enable  →  sudo pfctl -e -f configs/pf_backend_isolation.conf
#   Disable →  sudo pfctl -d
#   Status  →  sudo pfctl -s rules
# ─────────────────────────────────────────────────────────────────────────────

# ── Macros ───────────────────────────────────────────────────────────────────
# LAN interface on Mac 3 (adjust to match actual interface, e.g. en1 for Wi-Fi)
ext_if = "en0"

# Trusted upstream (Mac 2 – Edge Proxy)
edge_proxy = "10.7.8.201"

# Backend A port
backend_port = "3001"

# ── Options ──────────────────────────────────────────────────────────────────
# Do not drop packets silently; send TCP RST / ICMP unreachable so the client
# knows the connection was refused (useful for demonstration)
set block-policy return

# Normalise incoming packets (reassemble fragments, etc.)
scrub in all

# ── Rules ─────────────────────────────────────────────────────────────────────
# Default: pass all traffic (keep existing connectivity intact)
pass all

# ── BLOCK: any external host reaching port 3001 on this machine ───────────────
# The "quick" keyword means: match and stop rule evaluation immediately.
block in quick on $ext_if proto tcp \
    from any to any port $backend_port

# ── PASS: explicitly allow ONLY the edge proxy (Mac 2) to port 3001 ──────────
# This rule must appear AFTER the block rule to override it for the edge proxy.
# Because pf evaluates rules top-to-bottom and the LAST matching rule wins
# (unless "quick" is used), we use "quick" on the pass rule as well so this
# takes precedence for the specific source address.
pass in quick on $ext_if proto tcp \
    from $edge_proxy to any port $backend_port

# ── Allow loopback (local health-check / curl tests) ─────────────────────────
pass on lo0 all

# ─────────────────────────────────────────────────────────────────────────────
# Demonstration verification:
#
#   FROM Mac 2 (10.7.8.201):
#     curl http://10.7.8.30:3001/api/status   → {"status":"ok","backend":"A",...}
#
#   FROM Mac 4 (any other host):
#     curl http://10.7.8.30:3001/api/status   → Connection refused / timeout
# ─────────────────────────────────────────────────────────────────────────────
