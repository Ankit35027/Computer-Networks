# ==============================================================================
# dnsmasq Configuration for Mac 1 - Private DNS Server
# Computer Networks Course Project - Phase 1 Task B
# ==============================================================================

# Listen on standard DNS port 53
port=53

# Do not load /etc/hosts on Mac 1, rely explicitly on defined addresses
no-hosts

# Log DNS queries for debugging and Wireshark verification
log-queries
log-facility=/tmp/dnsmasq.log

# Never forward plain names without a dot or domain
domain-needed
bogus-priv

# Define upstream DNS fallback (Google / Cloudflare) for non-local domain requests
server=8.8.8.8
server=1.1.1.1

# Private Domain Mappings for Team 1 (.test TLD)
# Map project domain & subdomains directly to Mac 2's Private LAN IP Address
# Replace <MAC_2_PRIVATE_IP> with the actual LAN IP of Mac 2 (e.g., 192.168.1.50)

address=/app.team1.test/127.0.0.1
address=/api.team1.test/127.0.0.1
address=/team1.test/127.0.0.1

# Set short TTL (30s) for Phase 2 TTL & Failover testing
local-ttl=30
