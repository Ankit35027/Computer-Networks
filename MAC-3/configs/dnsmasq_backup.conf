# ─────────────────────────────────────────────────────────────────────────────
# dnsmasq_backup.conf – Mac 3 | Phase 2 Extension A: Backup DNS Resolver
#
# Rule: this file is an EXACT MIRROR of the primary's records
#       (MAC-1/configs/dnsmasq.conf). A backup is only useful if it gives the
#       same answers, so whenever a record changes on Mac 1 (Ext B / Ext E
#       cutover) the same change must be made here.
#
# It does NOT forward team1.test queries to Mac 1: if Mac 1 is down the backup
# must still answer on its own (that is the whole point of Extension A).
#
# Start (Mac 3):  sudo /opt/homebrew/sbin/dnsmasq --conf-file="$PWD/configs/dnsmasq_backup.conf"
# Stop:           sudo pkill -x dnsmasq
# Test:           dig @127.0.0.1 app.team1.test
# ─────────────────────────────────────────────────────────────────────────────

port=53
no-hosts
log-queries
log-facility=/tmp/dnsmasq_backup.log

domain-needed
bogus-priv

# Non-project names go to public resolvers (same as the primary)
server=8.8.8.8
server=1.1.1.1

# Same short TTL as the primary (Extension B)
local-ttl=30

# Domain mapping for Team 1 – IDENTICAL to Mac 1 (Mac 2 edge = MAC2_IP in team.env)
address=/app.team1.test/10.7.31.100
address=/api.team1.test/10.7.31.100
address=/team1.test/10.7.31.100
