# ─────────────────────────────────────────────────────────────────────────────
# dnsmasq_backup.conf – Mac 3 | Extension A: Backup DNS Resolver
# Role : Secondary DNS for the team1.test private domain
# Listens: 0.0.0.0:53 (all interfaces on Mac 3)
# Primary: 10.7.21.249 (Mac 1) Secondary: this host (10.7.22.2)
# ─────────────────────────────────────────────────────────────────────────────

# ── Listen address ───────────────────────────────────────────────────────────
interface=en0
listen-address=127.0.0.1,10.7.22.2
bind-dynamic

# ── Upstream forwarders (recursive resolution) ───────────────────────────────
# Primary DNS (Mac 1) first, followed by public fallbacks
server=10.7.21.249
server=1.1.1.1
server=8.8.8.8

# ── Private domain: team1.test ───────────────────────────────────────────────
local=/team1.test/

# A records for the live lab topology
# Mac 1 – Primary DNS
address=/ns1.team1.test/10.7.21.249
address=/mac1.team1.test/10.7.21.249

# Mac 2 – Primary Edge Proxy (TLS termination & Load Balancer)
address=/edge.team1.test/10.7.23.158
address=/mac2.team1.test/10.7.23.158
address=/app.team1.test/10.7.23.158
address=/api.team1.test/10.7.23.158
address=/team1.test/10.7.23.158

# Mac 3 – This host (Backup DNS + Backend A + Standby Edge)
address=/ns2.team1.test/10.7.22.2
address=/mac3.team1.test/10.7.22.2
address=/backend-a.team1.test/10.7.22.2

# Mac 4 – Backend B + Client Node
address=/mac4.team1.test/10.7.21.68
address=/backend-b.team1.test/10.7.21.68

# ── TTL & Caching ────────────────────────────────────────────────────────────
cache-size=500
local-ttl=30
min-cache-ttl=30

# ── Security ─────────────────────────────────────────────────────────────────
no-hosts
no-resolv
domain-needed
bogus-priv

# ── Logging ──────────────────────────────────────────────────────────────────
log-queries
log-facility=/tmp/dnsmasq-backup.log
