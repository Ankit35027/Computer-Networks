# ==============================================================================
# Nginx STANDBY EDGE on Mac 3 - Phase 2 Extension E (DNS-based edge migration)
# ------------------------------------------------------------------------------
# Same configuration as the primary edge (MAC-2/configs/nginx.conf):
#   * SAME TLS certificate + key (MAC-2/certs, signed by "Team1 Local Root CA"),
#     so clients that trust the Root CA see NO warning after the cutover.
#   * SAME upstream pool (Backend A on Mac 3 + Backend B on Mac 4).
# Only differences: pid/log file names and the X-Edge header value.
# Start (Mac 3, repo root):  nginx -c "$PWD/MAC-3/configs/nginx.conf"
# Stop:                      nginx -s stop -c "$PWD/MAC-3/configs/nginx.conf"
# Cutover = point app.team1.test at MAC3_IP on BOTH DNS servers (Ext B/E).
# ==============================================================================

worker_processes auto;
pid /tmp/nginx_mac3_standby.pid;
error_log /tmp/nginx_mac3_standby_error.log notice;

events {
    worker_connections 256;   # macOS default open-file limit is 256 (removes nginx warning)
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr backend_header: "$upstream_http_x_backend"';

    access_log /tmp/nginx_mac3_standby_access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression configuration
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # --------------------------------------------------------------------------
    # Upstream Backend Pool (Task D - Load Balancer)
    # IPs must match MAC3_IP / MAC4_IP in <repo>/team.env  (check: ./scripts/check_ips.sh)
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        # Round-Robin Load Balancing Algorithm (Default)
        # Shared memory zone: all nginx worker processes share ONE round-robin
        # counter and ONE view of failed backends -> strict A,B,A,B alternation
        # and consistent failover (Extension D).
        zone backend_cluster 1m;
        server 10.7.13.57:3001 max_fails=2 fail_timeout=5s;  # Mac 3 (Backend A) = MAC3_IP in team.env
        server 10.7.17.220:3002 max_fails=2 fail_timeout=5s; # Mac 4 (Backend B) = MAC4_IP in team.env
        
        # Keepalive connections to upstreams for improved performance
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80 / 8080) - Redirects traffic to HTTPS (Port 443 / 8443)
    # --------------------------------------------------------------------------
    server {
        listen 8080;
        listen [::]:8080;
        server_name app.team1.test api.team1.test team1.test localhost;

        # Health check endpoint for edge
        location /nginx_status {
            stub_status on;
            access_log off;
        }

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (Port 443 / 8443) - TLS Termination & Reverse Proxy
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test team1.test;

        # ----------------------------------------------------------------------
        # SSL / TLS Certificate Configuration (Task E)
        # ----------------------------------------------------------------------
        ssl_certificate     ../../MAC-2/certs/server.crt;   # relative to MAC-3/configs/ -> SAME cert as Mac 2
        ssl_certificate_key ../../MAC-2/certs/server.key;
        
        # TLS Protocol versions & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Which edge served this response (Extension E: shows DNS cutover Mac 2 -> Mac 3)
        add_header X-Edge "mac3-standby" always;

        # ----------------------------------------------------------------------
        # Reverse Proxy & Load Balancer Routing
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # HTTP Headers for upstream backend & client tracking
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Preserve upstream response headers (X-Backend, ETag, Cache-Control)
            proxy_pass_header X-Backend;
            proxy_pass_header ETag;
            proxy_pass_header Cache-Control;

            # Upstream error handling (Task D/Failover support)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
