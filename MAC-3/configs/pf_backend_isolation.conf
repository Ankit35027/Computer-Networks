# ─────────────────────────────────────────────────────────────────────────────
# pf_backend_isolation.conf – Mac 3 | Extension C: Service Isolation Firewall
# Purpose : Block direct external traffic to port 3001 (Backend A).
#           Only Mac 2 Edge Proxy (10.7.23.158) may reach port 3001.
#
# Usage:
#   Enable  →  sudo pfctl -e -f configs/pf_backend_isolation.conf
#   Disable →  sudo pfctl -d
#   Status  →  sudo pfctl -s rules
# ─────────────────────────────────────────────────────────────────────────────

# ── Macros ───────────────────────────────────────────────────────────────────
ext_if = "en0"
edge_proxy = "10.7.23.158"
backend_port = "3001"

# ── Options ──────────────────────────────────────────────────────────────────
set block-policy return
scrub in all

# ── Default traffic policy ───────────────────────────────────────────────────
pass in all
pass out all

# ── Loopback skip ────────────────────────────────────────────────────────────
pass on lo0 all

# ── Service Isolation Rules for Backend Port ─────────────────────────────────
# 1. Allow Mac 2 Edge Proxy explicitly
pass in quick on $ext_if proto tcp from $edge_proxy to any port $backend_port

# 2. Block all other external clients from reaching backend port
block in quick on $ext_if proto tcp from any to any port $backend_port
