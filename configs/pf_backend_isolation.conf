# ==============================================================================
# macOS Packet Filter (pf) Firewall Rules - Extension C (Service Isolation)
# Protects Backend Applications from direct unauthorized client access
# ==============================================================================

# Macro Definitions
edge_ip = "10.7.8.201"
loopback = "127.0.0.1"
backend_ports = "{ 3001, 3002 }"

# Options & Loopback Skip
set skip on lo0

# Default traffic policy: Allow normal LAN traffic
pass in all
pass out all

# Extension C Rule: Block any external IP trying to access backend ports directly
# Only Mac 2 Edge IP (10.7.8.201) or localhost loopback is permitted
block drop in quick proto tcp from ! $edge_ip to any port $backend_ports
