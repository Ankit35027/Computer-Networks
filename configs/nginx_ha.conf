# ==============================================================================
# Nginx HA & Passive Health Check Configuration for Mac 2 - Phase 2 (Extension D)
# ==============================================================================

worker_processes auto;
pid /tmp/nginx_mac2_ha.pid;
error_log /tmp/nginx_mac2_ha_error.log notice;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    'upstream: $upstream_addr backend_header: "$upstream_http_x_backend" '
                    'upstream_status: $upstream_status response_time: $upstream_response_time';

    access_log /tmp/nginx_mac2_ha_access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # --------------------------------------------------------------------------
    # Upstream Pool with Instant Health Checking (Extension D)
    # max_fails=1 & fail_timeout=3s ensures immediate ejection of failed node
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=3s; # Backend A
        server 127.0.0.1:3002 max_fails=1 fail_timeout=3s; # Backend B
        
        keepalive 32;
    }

    server {
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;
        server_name app.team1.test api.team1.test team1.test;

        ssl_certificate     "/Users/kchhillar13/computer network/certs/server.crt";
        ssl_certificate_key "/Users/kchhillar13/computer network/certs/server.key";
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_pass_header X-Backend;
            proxy_pass_header ETag;
            proxy_pass_header Cache-Control;

            # ------------------------------------------------------------------
            # Automated High-Availability Failover Directives (Extension D)
            # Instantly retries request on the healthy backend if first backend fails
            # ------------------------------------------------------------------
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;

            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;
        }
    }
}
