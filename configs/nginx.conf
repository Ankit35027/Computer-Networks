# ==============================================================================
# Nginx Configuration for Mac 2 - Edge Reverse Proxy & Load Balancer
# Computer Networks Course Project - Phase 1 (Tasks D, E, F)
# ==============================================================================

worker_processes auto;
pid /tmp/nginx_mac2.pid;
error_log /tmp/nginx_mac2_error.log notice;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr backend_header: "$upstream_http_x_backend"';

    access_log /tmp/nginx_mac2_access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression configuration
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # --------------------------------------------------------------------------
    # Upstream Backend Pool (Task D - Load Balancer)
    # Default points to local ports 3001 (Mac 3/Backend A) & 3002 (Mac 4/Backend B).
    # Update IP addresses when deployed across separate LAN machines.
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        # Round-Robin Load Balancing Algorithm (Default)
        server 10.7.22.2:3001 max_fails=2 fail_timeout=5s; # Mac 3 (Backend A)
        server 10.7.21.68:3002 max_fails=2 fail_timeout=5s; # Mac 4 (Backend B)
        
        # Keepalive connections to upstreams for improved performance
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80 / 8080) - Redirects traffic to HTTPS (Port 443 / 8443)
    # --------------------------------------------------------------------------
    server {
        listen 8080;
        listen [::]:8080;
        server_name app.team1.test api.team1.test team1.test localhost;

        # Health check endpoint for edge
        location /nginx_status {
            stub_status on;
            access_log off;
        }

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (Port 443 / 8443) - TLS Termination & Reverse Proxy
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test team1.test;

        # ----------------------------------------------------------------------
        # SSL / TLS Certificate Configuration (Task E)
        # ----------------------------------------------------------------------
        ssl_certificate     "/Users/kchhillar13/computer network/certs/server.crt";
        ssl_certificate_key "/Users/kchhillar13/computer network/certs/server.key";
        
        # TLS Protocol versions & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ----------------------------------------------------------------------
        # Reverse Proxy & Load Balancer Routing
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # HTTP Headers for upstream backend & client tracking
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Preserve upstream response headers (X-Backend, ETag, Cache-Control)
            proxy_pass_header X-Backend;
            proxy_pass_header ETag;
            proxy_pass_header Cache-Control;

            # Upstream error handling (Task D/Failover support)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
